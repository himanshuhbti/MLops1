<!DOCTYPE html>
<html>
<head>
    <title>ML Predictor</title>
</head>
<body>
    <h1>Enter Features</h1>
    <form action="/predict" method="post">
        <input type="text" name="f1" placeholder="Feature 1"><br>
        <input type="text" name="f2" placeholder="Feature 2"><br>
        <input type="text" name="f3" placeholder="Feature 3"><br>
        <input type="text" name="f4" placeholder="Feature 4"><br><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction is defined %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
